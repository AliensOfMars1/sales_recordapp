{% extends "ceo/base.html" %}

{% block title %}Add Service{% endblock %}
{% block page_title %}Add New Service{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3"><label class="form-label">Service Name</label><input type="text" name="name" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Price (GH₵)</label><input type="number" name="default_price" class="form-control" step="0.01" required></div>
            <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
            <div class="mb-3 form-check"><input type="checkbox" name="active" value="true" class="form-check-input" checked><label class="form-check-label">Active</label></div>
            <button type="submit" class="btn btn-primary">Save Service</button>
            <a href="{{ url_for('ceo.services') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
