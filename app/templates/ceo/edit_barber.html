{% extends "ceo/base.html" %}

{% block title %}Edit Barber{% endblock %}
{% block page_title %}Edit Barber{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" value="{{ barber.name }}" required></div>
            <div class="mb-3"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control" value="{{ barber.phone or '' }}"></div>
            <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ barber.email or '' }}"></div>
            <div class="mb-3 form-check"><input type="checkbox" name="active" value="true" class="form-check-input" {% if barber.active %}checked{% endif %}><label class="form-check-label">Active</label></div>
            <button type="submit" class="btn btn-primary">Update Barber</button>
            <a href="{{ url_for('ceo.barbers') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
